<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErTranslate – Free translator: text, voice, camera & conversation</title>
<meta name="description" content="ErTranslate is a free translator for every language: text, voice, camera, live conversation, word and idiom definitions,. | مترجم رایگان با ترجمه متنی، صوتی، تصویری و مکالمه.">
<meta name="keywords" content="translator, ErTranslate, voice translate, camera translate, مترجم, ترجمه تصویری, ترجمه صوتی">
<meta name="author" content="Erfan">
<meta name="theme-color" content="#1e2a78">
<link rel="canonical" href="https://kheradmanderfan.github.io/ertranslate/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="ErTranslate">
<meta property="og:description" content="Text, voice, camera and conversation translation for every language.">
<meta property="og:url" content="https://kheradmanderfan.github.io/ertranslate/">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"ErTranslate","url":"https://kheradmanderfan.github.io/ertranslate/","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"author":{"@type":"Person","name":"Erfan"}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>try{var p=JSON.parse(localStorage.getItem('ert.theme')||'"system"');var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.pref=p}catch(e){document.documentElement.dataset.theme='dark';document.documentElement.dataset.pref='system'}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h9M8.5 4v2M6 6c.5 3.5 3 6 6 7M12 6c-.5 3-3 6-7 8"/><path d="M13 20l4-9 4 9M14.5 17h5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <button id="uiLang" class="glass pill uibtn" data-ia="interfaceLang" aria-label="Interface language">
    <svg class="ic"><use href="#i-globe"/></svg><span id="uiCode">EN</span>
  </button>
  <h1 class="brand">ErTranslate</h1>
  <div class="topr">
    <button id="themeBtn" class="glass pill round themebtn" aria-label="Theme">
      <svg class="ic th-sys"><use href="#i-auto"/></svg>
      <svg class="ic th-sun"><use href="#i-sun"/></svg>
      <svg class="ic th-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main id="main">

  <!-- TEXT -->
  <section class="panel" id="p-text">
    <div id="lb-text"></div>
    <div class="card glass">
      <textarea id="tIn" dir="auto" rows="4" data-ip="typeHere" placeholder="Type or paste text" spellcheck="false"></textarea>
      <div class="tools">
        <button class="tool" id="tSpeakIn" data-ia="speak" aria-label="Listen"><svg class="ic"><use href="#i-volume"/></svg></button>
        <button class="tool" id="tClear" data-ia="cancel" aria-label="Clear"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="collapse" id="tRes"><div>
      <div class="card glass res">
        <p id="tOut" dir="auto" class="out"></p>
        <div class="tools">
          <button class="tool" id="tSpeakOut" data-ia="speak" aria-label="Listen"><svg class="ic"><use href="#i-volume"/></svg></button>
          <button class="tool" id="tCopy" data-ia="copy" aria-label="Copy"><svg class="ic"><use href="#i-copy"/></svg></button>
        </div>
      </div>
    </div></div>
  </section>

  <!-- VOICE -->
  <section class="panel" id="p-voice" hidden>
    <div id="lb-voice"></div>
    <div class="micwrap">
      <button class="mic big" id="vMic" data-ia="tapMic" aria-label="Microphone"><svg class="ic"><use href="#i-mic"/></svg></button>
      <p class="hint" id="vHint" data-i="tapMic">Tap the mic and speak</p>
    </div>
    <div class="collapse" id="vRes"><div>
      <div class="card glass res">
        <small class="lab" data-i="heard">You said</small>
        <p id="vHeard" dir="auto" class="heard"></p>
        <hr>
        <small class="lab" data-i="translation">Translation</small>
        <p id="vOut" dir="auto" class="out"></p>
        <div class="tools">
          <button class="tool" id="vSpeak" data-ia="speak" aria-label="Listen"><svg class="ic"><use href="#i-volume"/></svg></button>
          <button class="tool" id="vCopy" data-ia="copy" aria-label="Copy"><svg class="ic"><use href="#i-copy"/></svg></button>
        </div>
      </div>
    </div></div>
  </section>

  <!-- CAMERA -->
  <section class="panel" id="p-camera" hidden>
    <div id="lb-camera"></div>
    <div class="row2">
      <button class="btn glass" id="camShoot"><svg class="ic"><use href="#i-camera"/></svg><span data-i="takePhoto">Take photo</span></button>
      <button class="btn glass" id="camPick"><svg class="ic"><use href="#i-image"/></svg><span data-i="chooseImage">Choose image</span></button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="galIn" accept="image/*" hidden>
    <div class="collapse" id="camRes"><div>
      <div class="card glass res">
        <div class="status"><span id="camStatus"></span><i class="bar"><b id="camBar"></b></i></div>
        <canvas id="camCanvas" width="10" height="10"></canvas>
        <div id="camTexts" hidden>
          <small class="lab" data-i="original">Original text</small>
          <p id="camOrig" dir="auto" class="heard"></p>
          <hr>
          <small class="lab" data-i="translation">Translation</small>
          <p id="camOut" dir="auto" class="out"></p>
          <div class="tools">
            <button class="tool" id="camSpeak" data-ia="speak" aria-label="Listen"><svg class="ic"><use href="#i-volume"/></svg></button>
            <button class="tool" id="camCopy" data-ia="copy" aria-label="Copy"><svg class="ic"><use href="#i-copy"/></svg></button>
          </div>
        </div>
      </div>
    </div></div>
  </section>

  <!-- CONVERSATION -->
  <section class="panel" id="p-conv" hidden>
    <div class="chat glass" id="chat"><p class="empty" id="chatEmpty" data-i="convEmpty">Pick a language for each person, then tap a mic to start.</p></div>
    <div class="duo">
      <div class="side">
        <button class="lb glass-lite" id="cLangA"></button>
        <button class="mic" id="cMicA" data-ia="tapToTalk" aria-label="Person 1"><svg class="ic"><use href="#i-mic"/></svg></button>
        <span class="who" data-i="personA">Person 1</span>
      </div>
      <div class="side">
        <button class="lb glass-lite" id="cLangB"></button>
        <button class="mic alt" id="cMicB" data-ia="tapToTalk" aria-label="Person 2"><svg class="ic"><use href="#i-mic"/></svg></button>
        <span class="who" data-i="personB">Person 2</span>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="autoSpeak" checked><i></i><span data-i="autoSpeak">Speak translations aloud</span></label>
  </section>

  <!-- DICTIONARY -->
  <section class="panel" id="p-dict" hidden>
    <div id="lb-dict"></div>
    <div class="chips">
      <button class="chip on" data-mode="word" data-i="word">Word</button>
      <button class="chip" data-mode="idiom" data-i="idiom">Idiom</button>
    </div>
    <div class="card glass searchrow">
      <input id="dIn" dir="auto" data-ip="searchPlaceholder" placeholder="Word or idiom" autocomplete="off" spellcheck="false">
      <button class="tool go" id="dGo" data-ia="lookup" aria-label="Look up"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>
    <div class="collapse" id="dRes"><div>
      <div class="card glass res" id="dOut"></div>
    </div></div>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="p-hist" hidden>
    <div class="histhead"><button class="btn glass small" id="hClear"><svg class="ic"><use href="#i-trash"/></svg><span data-i="clearAll">Clear all</span></button></div>
    <div id="hList"></div>
  </section>

</main>

<footer class="made glass pill">
    <span id="mw">Made with</span>
    <svg class="heart" viewBox="0 0 24 24" aria-label="love"><use href="#i-heart"/></svg>
    <span id="mb">by Erfan</span>
  </footer>

<nav class="nav glass" id="nav" aria-label="Main">
  <button data-tab="text" class="on"><svg class="ic"><use href="#i-text"/></svg><span data-i="tabText">Text</span></button>
  <button data-tab="voice"><svg class="ic"><use href="#i-mic"/></svg><span data-i="tabVoice">Voice</span></button>
  <button data-tab="camera"><svg class="ic"><use href="#i-camera"/></svg><span data-i="tabCamera">Camera</span></button>
  <button data-tab="conv"><svg class="ic"><use href="#i-chat"/></svg><span data-i="tabConv">Chat</span></button>
  <button data-tab="dict"><svg class="ic"><use href="#i-book"/></svg><span data-i="tabDict">Define</span></button>
  <button data-tab="hist"><svg class="ic"><use href="#i-clock"/></svg><span data-i="tabHist">History</span></button>
</nav>

<!-- Bottom sheet (language picker / offline manager) -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="back" id="sheetBack"></div>
  <div class="box glass" role="dialog" aria-modal="true">
    <div class="sheethead">
      <h2 id="sheetTitle"></h2>
      <button class="tool" id="sheetX" data-ia="cancel" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="sheetsearch"><input id="sheetQ" data-ip="searchLang" placeholder="Search language" autocomplete="off"></div>
    <p class="note" id="sheetNote" hidden></p>
    <div class="sheetbody" id="sheetBody"></div>
  </div>
</div>

<div class="toast glass pill" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="text-align:center;padding:2rem">ErTranslate needs JavaScript. / برای استفاده از ErTranslate جاوااسکریپت لازم است.</p></noscript>
<script src="app.js"></script>
</body>
</html>
